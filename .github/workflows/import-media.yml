name: Import original portfolio media
on:
  push:
    branches: [production]
    paths:
      - '.github/workflows/import-media.yml'
      - 'deploy/media-manifest.json'
permissions:
  contents: write
concurrency:
  group: original-portfolio-media
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MEDIA_REF: ${{ github.sha }}
    steps:
      - name: Transfer and verify original media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time, urllib.request
          repo, ref = os.environ['GH_REPO'], os.environ['MEDIA_REF']
          url = f'https://raw.githubusercontent.com/{repo}/{ref}/deploy/media-manifest.json'
          with urllib.request.urlopen(url, timeout=60) as response:
              manifest = json.load(response)
          base = manifest.get('importBase')
          if not base:
              print('Importer ready; original media transfer has not started.')
              raise SystemExit(0)
          tag = manifest['releaseTag']
          files = manifest['files']
          folder = pathlib.Path('original-media')
          folder.mkdir(exist_ok=True)
          for item in files:
              destination = folder / item['name']
              if destination.name != item['name'] or '/' in item['name'] or '\\' in item['name']:
                  raise RuntimeError('Invalid media name')
              for attempt in range(4):
                  try:
                      digest = hashlib.sha256()
                      total = 0
                      with urllib.request.urlopen(base.rstrip('/') + '/' + item['name'], timeout=180) as response, destination.open('wb') as output:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              output.write(chunk)
                              digest.update(chunk)
                              total += len(chunk)
                      if total != item['bytes'] or digest.hexdigest() != item['sha256']:
                          raise RuntimeError('Original media checksum mismatch')
                      print(f"Verified {item['name']}: {total} original bytes", flush=True)
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(3 * (attempt + 1))
          checksums = folder / 'sha256.json'
          checksums.write_text(json.dumps({'files': files}, indent=2))
          present = subprocess.run(['gh','release','view',tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
          if not present:
              subprocess.run(['gh','release','create',tag,'--target',ref,'--title','Original portfolio media','--notes','Original portfolio media assets. Source files were verified by SHA-256 without recompression.'], check=True)
          subprocess.run(['gh','release','upload',tag,'--clobber',*[str(folder/item['name']) for item in files],str(checksums)], check=True)
          assets = json.loads(subprocess.check_output(['gh','release','view',tag,'--json','assets']))['assets']
          sizes = {item['name']: item['size'] for item in assets}
          for item in files:
              if sizes.get(item['name']) != item['bytes']:
                  raise RuntimeError('Cloud asset size mismatch')
          print(f'Uploaded and verified {len(files)} original media files.', flush=True)
          PY
